# SPDX-License-Identifier: Apache-2.0
name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # daily: pick up new musicdl commits, then rebuild
    - cron: "17 4 * * *"

permissions:
  contents: write

concurrency:
  group: flatpak-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license:
    # Cheap and independent of the build: a corrupted or swapped LICENSE
    # shows up as a red X within seconds instead of after a 3 minute build.
    name: Check license text
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify LICENSE is unmodified Apache-2.0
        run: python3 scripts/check-license.py

  update-upstream:
    name: Pin latest musicdl commit
    # Also run on pushes to main so a manifest edit gets re-pinned promptly;
    # cron still catches upstream changes made while this repo sits idle.
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.pin.outputs.changed }}
      sha: ${{ steps.pin.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - name: Update source pin
        id: pin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/update-upstream.py

  build:
    name: Build bundle
    needs: [update-upstream]
    if: |
      always() &&
      needs.update-upstream.result != 'failure' &&
      needs.update-upstream.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      # On schedule/dispatch github.sha is the commit from when the run was
      # queued, which is older than the pin the update job may just have
      # committed. Resolve the branch tip instead so we build what was pushed.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref_name }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder librsvg2-bin
          # Ubuntu 24.04+ restricts unprivileged user namespaces, which bwrap needs
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Cache runtimes and downloads
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/flatpak
            .flatpak-builder/downloads
          key: flatpak-${{ runner.os }}-${{ hashFiles('*.json') }}
          restore-keys: |
            flatpak-${{ runner.os }}-

      - name: Install runtime and SDK
        run: |
          flatpak --user remote-add --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak --user install -y --noninteractive flathub \
            org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Build
        run: |
          if ! sh scripts/build.sh > /tmp/build.log 2>&1; then
            tail -n 80 /tmp/build.log
            msg=$(tail -n 40 /tmp/build.log \
              | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{printf "%s%%0A", $0}')
            echo "::error::flatpak build failed: ${msg:0:60000}"
            exit 1
          fi
          tail -n 10 /tmp/build.log

      - name: Smoke test the bundle
        run: |
          flatpak --user install -y --noninteractive MusicDL.flatpak
          flatpak run --command=python3 io.github.deltaq471.musicdl -c \
            "import tkinter, yt_dlp; print('tk', tkinter.TkVersion, 'yt-dlp', yt_dlp.version.__version__)"
          # every redistributed component must carry its license text
          flatpak run --command=sh io.github.deltaq471.musicdl -c '
            for f in /app/share/licenses/io.github.deltaq471.musicdl/LICENSE \
                     /app/share/licenses/tcl/license.terms \
                     /app/share/licenses/tk/license.terms \
                     /app/share/licenses/zlib/LICENSE \
                     /app/share/licenses/libtommath/LICENSE \
                     /app/share/licenses/python/LICENSE; do
              test -s "$f" || { echo "missing license: $f"; exit 1; }
            done
            echo "all bundled licenses present"'

      - name: Summarise
        run: |
          ls -lh MusicDL.flatpak
          sha256sum MusicDL.flatpak | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: MusicDL.flatpak
          path: MusicDL.flatpak
          if-no-files-found: error
          retention-days: 30

      # Every successful non-PR build republishes one rolling release, so users
      # always have a stable URL:
      #   https://github.com/youwebssik6789/musicdl-flatpak/releases/download/latest/MusicDL.flatpak
      - name: Publish latest release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=latest
          built=$(git rev-parse HEAD)
          bundle_sha=$(sha256sum MusicDL.flatpak | cut -d' ' -f1)
          bundle_bytes=$(stat -c%s MusicDL.flatpak)
          upstream=$(python3 -c "import json;m=json.load(open('io.github.deltaq471.musicdl.json'));print(m['modules'][-1]['sources'][0]['url'].rsplit('/',1)[1].removesuffix('.tar.gz'))")

          {
            printf 'Automated Flatpak build of musicdl, republished on every change.\n\n'
            printf -- '- musicdl source: [%s](https://github.com/deltaq471/musicdl/commit/%s)\n' "${upstream:0:7}" "$upstream"
            printf -- '- packaging commit: %s\n' "$built"
            printf -- '- built: %s\n' "$(date -u +'%Y-%m-%d %H:%M UTC')"
            printf -- '- size: %s bytes\n' "$bundle_bytes"
            printf -- '- sha256: %s\n\n' "$bundle_sha"
            printf 'Install:\n\n'
            printf '```sh\n'
            printf 'flatpak install --user MusicDL.flatpak\n'
            printf 'flatpak run io.github.deltaq471.musicdl\n'
            printf '```\n'
          } > /tmp/notes.md

          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --target "$built" \
                 --title "MusicDL Flatpak" --notes-file /tmp/notes.md
          gh release upload "$tag" MusicDL.flatpak --clobber
          gh release edit "$tag" --title "MusicDL Flatpak" \
            --notes-file /tmp/notes.md --latest

          # keep the tag on the exact source commit the asset was built from
          git tag -f "$tag" "$built"
          git push -f origin "refs/tags/$tag"
